<div style="background:#F7F8FA;padding:32px 16px;font-family:Arial,Helvetica,sans-serif;color:#1A1A2E">
  <div style="max-width:540px;margin:0 auto;background:#ffffff;border:1px solid #E6E8EC;border-radius:16px;overflow:hidden">
    <div style="background:#1A1A2E;padding:20px 24px">
      <img src="{{ logo_url }}" width="40" height="40" alt="Pocket Shop" style="border-radius:10px;vertical-align:middle">
      <span style="color:#ffffff;font-size:18px;font-weight:bold;vertical-align:middle;margin-left:8px">Pocket Shop</span>
    </div>
    <div style="padding:26px 24px;font-size:15px;line-height:1.55;color:#1A1A2E">
      {% block body %}{% endblock %}
    </div>
    <div style="padding:14px 24px;border-top:1px solid #E6E8EC;font-size:12px;color:#5B6172">
      Pocketshop Market Limited · Lusaka, Zambia · <a href="{{ site_url }}" style="color:#00838F">mypocketshop.store</a>
    </div>
  </div>
</div>
