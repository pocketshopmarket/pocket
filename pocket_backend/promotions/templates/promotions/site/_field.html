<div class="pp-field{% if field.errors %} has-error{% endif %}">
  {% if radio %}
  <span class="pp-label">{{ field.label }}</span>
  <div class="pp-choices">
    {% for choice in field %}<label class="pp-choice">{{ choice.tag }} {{ choice.choice_label }}</label>{% endfor %}
  </div>
  {% else %}
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {{ field }}
  {% endif %}
  {% if field.help_text %}<p class="pp-help">{{ field.help_text }}</p>{% endif %}
  {% for e in field.errors %}<p class="pp-err">{{ e }}</p>{% endfor %}
</div>
